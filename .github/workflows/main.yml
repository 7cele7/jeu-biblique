name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP archive
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq unzip
          ZIP_FILE=$(ls *.zip | head -1)
          echo "Found ZIP: $ZIP_FILE"
          unzip -o -q "$ZIP_FILE"
          echo "=== Structure ==="
          ls -la
          find . -maxdepth 3 -name "package.json" -not -path "./.github/*"

      - name: Find project directory
        id: find-project
        run: |
          PKG_JSON=$(find . -maxdepth 4 -name "package.json" -not -path "./.github/*" | head -1)
          if [ -z "$PKG_JSON" ]; then
            echo "ERROR: No package.json found in extracted archive!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PKG_JSON")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_OUTPUT
          echo "Project found at: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install project dependencies
        working-directory: ${{ steps.find-project.outputs.PROJECT_DIR }}
        run: npm install

      - name: Install Capacitor & Android platform
        working-directory: ${{ steps.find-project.outputs.PROJECT_DIR }}
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Logos" com.logos.jeubiblique --web-dir dist
          npx cap add android

      - name: Build React app
        working-directory: ${{ steps.find-project.outputs.PROJECT_DIR }}
        run: npm run build

      - name: Sync Capacitor
        working-directory: ${{ steps.find-project.outputs.PROJECT_DIR }}
        run: npx cap sync android

      - name: Fix Kotlin dependency conflicts
        working-directory: ${{ steps.find-project.outputs.PROJECT_DIR }}
        run: |
          sed -i '0,/dependencies {/s//configurations.all {\n    resolutionStrategy.eachDependency { details ->\n        if (details.requested.group == "org.jetbrains.kotlin") {\n            details.useVersion "1.8.22"\n        }\n    }\n}\ndependencies {/' android/app/build.gradle

      - name: Build APK
        working-directory: ${{ steps.find-project.outputs.PROJECT_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: logos-debug
          path: ${{ steps.find-project.outputs.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
