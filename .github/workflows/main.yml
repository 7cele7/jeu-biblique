name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract ZIP archive
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq unzip
          ZIP_FILE=$(ls *.zip | head -1)
          echo "Found ZIP: $ZIP_FILE"
          unzip -o -q "$ZIP_FILE"   # ← -o force l'écrasement sans demander
          ls -la

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install project dependencies
        run: npm install

      - name: Install Capacitor & Android platform
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Logos" com.logos.jeubiblique --web-dir dist
          npx cap add android

      - name: Build React app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Fix Kotlin dependency conflicts
        run: |
          sed -i '0,/dependencies {/s//configurations.all {\n    resolutionStrategy.eachDependency { details ->\n        if (details.requested.group == "org.jetbrains.kotlin") {\n            details.useVersion "1.8.22"\n        }\n    }\n}\ndependencies {/' android/app/build.gradle

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: logos-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
