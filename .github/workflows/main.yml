name: Build Capacitor APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean & extract ZIP
        run: |
          cd $GITHUB_WORKSPACE
          find . -maxdepth 1 -not -path "./.git*" -not -path "./.github*" -not -path "." -not -name "*.zip" -exec rm -rf {} +
          ZIP_FILE=$(ls *.zip 2>/dev/null | head -1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting: $ZIP_FILE"
            unzip -o -q "$ZIP_FILE"
          else
            echo "ERROR: No ZIP found!"
            exit 1
          fi
          ls -la

      - name: Find project folder
        id: project
        run: |
          cd $GITHUB_WORKSPACE
          # Cherche package.json (projet React)
          PKG=$(find . -maxdepth 2 -name "package.json" | head -1)
          if [ -z "$PKG" ]; then
            echo "ERROR: package.json not found!"
            exit 1
          fi
          PROJECT_ROOT=$(dirname "$PKG")
          PROJECT_ROOT=${PROJECT_ROOT#./}
          [ -z "$PROJECT_ROOT" ] && PROJECT_ROOT="."
          echo "root=$PROJECT_ROOT" >> $GITHUB_OUTPUT
          echo "Project found at: $PROJECT_ROOT"

      - name: Setup Node & Java
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies & build
        run: |
          cd ${{ steps.project.outputs.root }}
          npm install
          npm run build

      - name: Detect build folder
        id: builddir
        run: |
          cd ${{ steps.project.outputs.root }}
          if [ -d "build" ]; then
            echo "dir=build" >> $GITHUB_OUTPUT
          elif [ -d "dist" ]; then
            echo "dir=dist" >> $GITHUB_OUTPUT
          else
            echo "dir=." >> $GITHUB_OUTPUT
          fi

      - name: Setup Capacitor Android
        run: |
          cd ${{ steps.project.outputs.root }}
          # Installe Capacitor si pas déjà fait
          npm install @capacitor/core @capacitor/cli @capacitor/android
          # Initialise si pas déjà fait
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            npx cap init "Yaounde Delices" "com.yaoundedelices.app" --web-dir ${{ steps.builddir.outputs.dir }}
          fi
          # Ajoute Android si pas déjà fait
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          # Sync
          npx cap sync android

      - name: Build APK
        run: |
          cd ${{ steps.project.outputs.root }}/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: capacitor-apk
          path: ${{ steps.project.outputs.root }}/android/app/build/outputs/apk/debug/*.apk
