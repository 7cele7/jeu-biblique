name: Build and Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Installer Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Configurer Java (nécessaire pour Android)
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. Installer les dépendances (DANS LE BON DOSSIER !)
      - name: Install dependencies
        run: npm install
        working-directory: NOM_DU_DOSSIER_PROJET   # <--- CHANGEZ ICI !

      # 5. Build du projet React (DANS LE BON DOSSIER !)
      - name: Build project
        run: npm run build
        working-directory: NOM_DU_DOSSIER_PROJET   # <--- CHANGEZ ICI !

      # 6. Détecter le dossier de build Capacitor
      - name: Detect build folder
        run: ls
        working-directory: NOM_DU_DOSSIER_PROJET

      # 7. Build APK Android (Exemple générique)
      - name: Build Capacitor Android
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
        working-directory: NOM_DU_DOSSIER_PROJET

      # 8. Upload de l'APK (Optionnel)
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: NOM_DU_DOSSIER_PROJET/android/app/build/outputs/apk/debug/app-debug.apk
