name: Build Android APK from Zip

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Djava.awt.headless=true -Dorg.gradle.daemon=false"
  JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"

jobs:
  build-apk:
    name: 🚀 Construire l'APK Android
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Cloner le dépôt
        uses: actions/checkout@v4

      - name: 📦 Décompresser le fichier ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Fichier ZIP détecté : $ZIP_FILE. Décompression..."
            unzip -o "$ZIP_FILE" -d .
          fi

      - name: ☕ Configurer Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🐘 Configurer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 🔧 Générer le Wrapper Gradle si absent
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: 🔨 Compiler l'APK (Debug)
        run: ./gradlew assembleDebug -x validateSigningDebug

      - name: 📤 Sauvegarder l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Biblical-RPG-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
